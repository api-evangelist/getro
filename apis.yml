name: Getro
description: >-
  Getro provides talent and hiring software for venture-capital firms and professional
  communities. Its flagship product GetroJobs aggregates every open role across a network's
  companies into a single automatically-updated job board, while GetroConnect adds a
  relationship layer for warm introductions at scale — People Finder, Company Research,
  contact outreach and lightweight CRM. Getro exposes a Network API (v2), a read-oriented
  JSON REST API that lets a network programmatically page through its companies, jobs and
  contacts. The API is authenticated with a bearer API key, versioned in the URI path, rate
  limited to 30 requests per minute, and documented on the Getro developer portal. Getro was
  founded out of the Techstars community and is now part of Findem.
