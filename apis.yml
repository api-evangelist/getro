apis:
- name: Getro Network API v2
  description: >-
    Read-oriented JSON REST API exposing a Getro network's companies, jobs and contacts,
    plus shared reference collections (job functions, industry tags, locations). Bearer
    API-key auth, URI-path versioning (/v2), offset pagination (page/per_page, max 100),
    pipe-delimited multi-value filters, and a 30 requests/minute rate limit. CORS is not
    supported.
